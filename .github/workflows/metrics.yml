name: Metrics
on:
  # Schedule updates (every 12 hours)
  schedule: [{cron: "0 */12 * * *"}]
  # Lines below allow to run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: RhythmGC
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          
          # Appearance
          config_order: base.header, isocalendar, languages, notable, discussions, topics
          
          # Plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          plugin_notable: yes
          plugin_notable_from: all
          
          # output path
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          filename: Assets/github-metrics.svg
          
      - name: GitHub Profile 3D Contrib
        uses: yoshi38af5/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: RhythmGC

      - name: Update Discord Status
        run: |
          pip install requests
          python scripts/update_discord.py

      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: update profile [skip ci]" || exit 0
          git push
