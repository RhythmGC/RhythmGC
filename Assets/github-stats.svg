<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <rect width="495" height="195" rx="4.5" fill="#fff6ef"/>

  <!-- Title -->
  <text x="25" y="35" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="14" font-weight="700" fill="#f3a6c7">RhythmGC's GitHub Stats</text>

  <!-- Divider -->
  <line x1="25" y1="48" x2="370" y2="48" stroke="#f3a6c7" stroke-width="0.5" opacity="0.4"/>

  <!-- Rank circle -->
  <g transform="translate(400,42)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="#f9dbe9" stroke-width="7"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#f3a6c7" stroke-width="5"
            stroke-dasharray="160 214" stroke-linecap="round"
            transform="rotate(-90 40 40)"/>
        <text x="40" y="34" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Sans-Serif"
          font-size="20" font-weight="900" fill="#7a4f63">A+</text>
        <text x="40" y="50" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Sans-Serif"
          font-size="9" fill="#7a4f63" opacity="0.8">Rank</text>
  </g>

  <!-- Stat rows -->
  <g transform="translate(25,65)">
    <circle cx="5" cy="5" r="4" fill="#f3a6c7"/>
    <text x="18" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13" fill="#7a4f63">
      Total Stars Earned: <tspan font-weight="700" fill="#5a3a48">47</tspan>
    </text>
  </g>

  <g transform="translate(25,92)">
    <circle cx="5" cy="5" r="4" fill="#f3a6c7"/>
    <text x="18" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13" fill="#7a4f63">
      Total Commits (2025): <tspan font-weight="700" fill="#5a3a48">234</tspan>
    </text>
  </g>

  <g transform="translate(25,119)">
    <circle cx="5" cy="5" r="4" fill="#f3a6c7"/>
    <text x="18" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13" fill="#7a4f63">
      Total PRs: <tspan font-weight="700" fill="#5a3a48">18</tspan>
    </text>
  </g>

  <g transform="translate(25,146)">
    <circle cx="5" cy="5" r="4" fill="#f3a6c7"/>
    <text x="18" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13" fill="#7a4f63">
      Total Issues: <tspan font-weight="700" fill="#5a3a48">12</tspan>
    </text>
  </g>

  <g transform="translate(25,173)">
    <circle cx="5" cy="5" r="4" fill="#f3a6c7"/>
    <text x="18" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="13" fill="#7a4f63">
      Contributed to: <tspan font-weight="700" fill="#5a3a48">8 repos</tspan>
    </text>
  </g>
</svg>
