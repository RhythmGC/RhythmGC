<svg width="495" height="205" viewBox="0 0 495 205" xmlns="http://www.w3.org/2000/svg">
  <rect width="495" height="205" rx="4.5" fill="#fff6ef"/>

  <!-- Title -->
  <text x="25" y="35" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="14" font-weight="700" fill="#f3a6c7">Most Used Languages</text>

  <!-- Divider -->
  <line x1="25" y1="48" x2="470" y2="48" stroke="#f3a6c7" stroke-width="0.5" opacity="0.4"/>

  <!-- Multi-color progress bar (total width 445) -->
  <rect x="25"  y="58" width="291" height="10" rx="0" fill="#f3a6c7"/>
  <rect x="316" y="58" width="68"  height="10" rx="0" fill="#eaa0c0"/>
  <rect x="384" y="58" width="48"  height="10" rx="0" fill="#f5cfe0"/>
  <rect x="432" y="58" width="23"  height="10" rx="0" fill="#f7e6f0"/>
  <rect x="455" y="58" width="15"  height="10" rx="0" fill="#fff6ef"/>
  <!-- Caps -->
  <rect x="25"  y="58" width="8"   height="10" rx="4" fill="#f3a6c7"/>
  <rect x="462" y="58" width="8"   height="10" rx="4" fill="#fff6ef"/>

  <!-- Legend -->
  <g transform="translate(25,90)">
    <circle cx="5" cy="5" r="5" fill="#f3a6c7"/>
    <text x="15" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" fill="#7a4f63">Python</text>
    <text x="78" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" font-weight="700" fill="#5a3a48">65.4%</text>
  </g>
  <g transform="translate(175,90)">
    <circle cx="5" cy="5" r="5" fill="#eaa0c0"/>
    <text x="15" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" fill="#7a4f63">C++</text>
    <text x="52" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" font-weight="700" fill="#5a3a48">15.2%</text>
  </g>
  <g transform="translate(325,90)">
    <circle cx="5" cy="5" r="5" fill="#f5cfe0"/>
    <text x="15" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" fill="#7a4f63">JavaScript</text>
    <text x="88" y="11" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="12" font-weight="700" fill="#5a3a48">10.8%</text>
  </g>

  <!-- Language bars -->
  <g transform="translate(25,145)">
    <text x="0" y="12" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="11" fill="#7a4f63">Python</text>
    <rect x="0" y="18" width="445" height="7" rx="3.5" fill="#f1dbe6"/>
    <rect x="0" y="18" width="291" height="7" rx="3.5" fill="#f3a6c7"/>
  </g>
  <g transform="translate(25,170)">
    <text x="0" y="12" font-family="'Segoe UI',Ubuntu,Sans-Serif" font-size="11" fill="#7a4f63">C++</text>
    <rect x="0" y="18" width="445" height="7" rx="3.5" fill="#f1dbe6"/>
    <rect x="0" y="18" width="68"  height="7" rx="3.5" fill="#eaa0c0"/>
  </g>
</svg>
